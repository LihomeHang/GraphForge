[project]
name = "graphforge"
version = "0.1.0"
description = "Independent general-purpose knowledge graph generation tool: documents -> knowledge graph -> semantic search"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "neo4j>=5.24",
    "qdrant-client>=1.12",
    "pymupdf>=1.24",
    "charset-normalizer>=3.3",
    "pydantic>=2.8",
    "httpx>=0.27",
    "numpy>=2.0",
    "structlog>=24.4",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
